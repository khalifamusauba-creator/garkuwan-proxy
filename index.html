<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <style>
        body { background-color: #0b141a; color: #e9edef; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        header { background-color: #202c33; padding: 15px; font-weight: bold; border-bottom: 1px solid #3b4a54; position: sticky; top: 0; }
#chat-container { flex: 1; overflow-y: auto; padding: 20px; background-color: #0b141a; display: flex; flex-direction: column; }
        .message { margin-bottom: 15px; max-width: 85%; padding: 8px 12px; border-radius: 8px; font-size: 15px; }
        .user { align-self: flex-end; background-color: #005c4b; border-bottom-right-radius: 2px; }
        .ai { align-self: flex-start; background-color: #202c33; border-bottom-left-radius: 2px; }
        footer { background-color: #202c33; padding: 10px; display: flex; gap: 10px; }
        input { flex: 1; background-color: #2a3942; border: none; border-radius: 20px; padding: 12px; color: white; outline: none; }
        button { background-color: #00a884; border: none; border-radius: 50%; width: 45px; height: 45px; color: white; cursor: pointer; }
    </style>
</head><body>
    <header>AI Assistant (Garkuwa)</header>
    <div id="chat-container"></div>
    <footer>
        <input type="text" id="userInput" placeholder="Rubuta sakonka...">
        <button onclick="sendMessage()">➤</button>
    </footer><script>
        async function sendMessage() {
            const input = document.getElementById("userInput");
            const container = document.getElementById("chat-container");
            if (!input.value.trim()) return;
            const userMsg = input.value;
            container.innerHTML += `<div class="message user">${userMsg}</div>`;
            input.value = "";
            container.scrollTop = container.scrollHeight;
            try {
                const response = await fetch('/api/ask', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({prompt: userMsg})
                });
                const data = await response.json();
                container.innerHTML += `<div class="message ai">${data.answer || data.error}</div>`;
            } catch (e) {
                container.innerHTML += `<div class="message ai">Error: Duba Internet dinka.</div>`;
            }
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
