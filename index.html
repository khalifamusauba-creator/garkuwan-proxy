<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imrana AI - Official</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e5ddd5; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        .header { background-color: #075e54; color: white; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .header-info { display: flex; align-items: center; }
        .header-info img { width: 40px; height: 40px; border-radius: 50%; margin-right: 10px; background: #ccc; }
.header-text h2 { margin: 0; font-size: 16px; }
        .header-text p { margin: 0; font-size: 12px; opacity: 0.8; }
        .chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; }
        .message { max-width: 80%; margin-bottom: 10px; padding: 8px 12px; border-radius: 8px; font-size: 15px; line-height: 1.4; position: relative; }
        .user-message { align-self: flex-end; background-color: #dcf8c6; color: #000; border-top-right-radius: 0; }
        .ai-message { align-self: flex-start; background-color: #fff; color: #000; border-top-left-radius: 0; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        .input-area { background-color: #f0f0f0; padding: 10px; display: flex; align-items: center; }
        .input-container { background: white; flex: 1; border-radius: 25px; padding: 5px 15px; display: flex; align-items: center; margin-right: 10px; }
        input { flex: 1; border: none; outline: none; padding: 8px; font-size: 16px; }
        .icons { color: #919191; margin: 0 5px; cursor: pointer; }
        .send-btn { background-color: #075e54; color: white; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="header">
    <div class="header-info">
        <img src="https://cdn-icons-png.flaticon.com/512/4712/4712035.png" alt="AI">
        <div class="header-text">
            <h2>Imrana AI Chat</h2>
            <p>Created by Imrana Umar Abubakar</p>
        </div>
    </div>
    <div>
        <i class="fas fa-video icons" style="color:white"></i>
        <i class="fas fa-phone icons" style="color:white"></i>
        <i class="fas fa-ellipsis-v icons" style="color:white"></i>
    </div>
</div>
<div class="chat-container" id="chat-container">
    <div class="message ai-message">Sannu! Ni ne AI dinka. Imrana Umar Abubakar ne ya kera ni.</div>
</div>
