<!DOCTYPE html>
<html lang="ha">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garkuwan AI na Imrana</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
        .message { margin: 10px 0; padding: 10px; border-radius: 10px; max-width: 80%; }
        .user { background-color: #007bff; color: white; align-self: flex-end; }
        .ai { background-color: #e2e2e2; color: black; align-self: flex-start; }
        #input-container { padding: 10px; background: white; display: flex; }
        input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; margin-left: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div id="chat-container">
    <div class="message ai">Sannu! Ni ne Garkuwan AI na Imrana. Ta yaya zan iya taimaka maka yau?</div>
</div>

<div id="input-container">
    <input type="text" id="user-input" placeholder="Rubuta sakon ka a nan...">
    <button onclick="sendMessage()">Aika</button>
</div>

<script>
    async function sendMessage() {
        const input = document.getElementById('user-input');
        const container = document.getElementById('chat-container');
        const prompt = input.value;
        if (!prompt) return;

        // Nuna sakon user
        const userDiv = document.createElement('div');
        userDiv.className = 'message user';
        userDiv.innerText = prompt;
        container.appendChild(userDiv);
        input.value = '';

        try {
            // Kiran Netlify Function dinka
            const response = await fetch('https://51cefayaronmalam.netlify.app/.netlify/functions/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: prompt })
            });

            const data = await response.json();
            
            // Nuna sakon AI
            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai';
            aiDiv.innerText = data.text || "An samu matsala wajen samun amsa.";
            container.appendChild(aiDiv);
        } catch (error) {
            const errDiv = document.createElement('div');
            errDiv.className = 'message ai';
            errDiv.style.color = 'red';
            errDiv.innerText = "Matsalar Network! Tabbatar ka yi Trigger Deploy a Netlify.";
            container.appendChild(errDiv);
        }
        container.scrollTop = container.scrollHeight;
    }
</script>

</body>
  </html>
